[project]
name = "rover-voice"
version = "0.1.0"
description = "Host-local offline voice service for Jarvis Rover"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1",
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.3.0,<3",
]

[project.optional-dependencies]
runtime = [
  "numpy>=1.26,<3",
  "openwakeword==0.6.0",
  "pocket-tts==1.1.0",
  "pyyaml>=6.0,<7",
  "sherpa-onnx>=1.10.0,<2",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
