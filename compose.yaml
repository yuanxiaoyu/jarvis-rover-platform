services:
  rover-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: jarvis-rover-runtime
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      ROVER_TELEMETRY_INTERVAL_SECONDS: ${ROVER_TELEMETRY_INTERVAL_SECONDS:-1.0}
      JARVIS_ENABLE_WAKE_WORD: ${JARVIS_ENABLE_WAKE_WORD:-false}
      JARVIS_ENABLE_ASR: ${JARVIS_ENABLE_ASR:-false}
      JARVIS_ENABLE_TTS: ${JARVIS_ENABLE_TTS:-false}
    devices:
      - ${MICROROS_SERIAL_DEVICE:-/dev/myserial}:${MICROROS_SERIAL_DEVICE:-/dev/myserial}
      - ${RPLIDAR_DEVICE:-/dev/rplidar}:${RPLIDAR_DEVICE:-/dev/rplidar}
    volumes:
      - ./models:/workspace/models
      - ./data:/workspace/data
    command: ["api"]

  micro-ros-agent:
    image: microros/micro-ros-agent:humble
    container_name: jarvis-micro-ros-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rover-runtime
    command:
      [
        "serial",
        "--dev",
        "${MICROROS_SERIAL_DEVICE:-/dev/myserial}",
        "-b",
        "${MICROROS_SERIAL_BAUD:-115200}"
      ]
    devices:
      - ${MICROROS_SERIAL_DEVICE:-/dev/myserial}:${MICROROS_SERIAL_DEVICE:-/dev/myserial}
